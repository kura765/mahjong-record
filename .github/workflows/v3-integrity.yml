name: v3 integrity checks
on:
  push:
    paths:
      - 'v3/**'
      - 'supabase/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/v3-integrity.yml'
  pull_request:
    paths:
      - 'v3/**'
      - 'supabase/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/v3-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: node --test tests/v3-integrity.test.mjs
